<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You! — Sivakarthick S</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .success-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 48px 36px;
      border-radius: 24px;
      backdrop-filter: blur(16px);
      max-width: 500px;
      width: 100%;
    }
    .success-emoji {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .success-card h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      margin-bottom: 12px;
    }
    .success-card p {
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-card">
      <div class="success-emoji">🎉</div>
      <h1>Message <span class="gradient-text">Received!</span></h1>
      <p>Thanks for reaching out! I've received your message and will get back to you as soon as possible.</p>
      <a href="/" class="btn-primary" style="display: inline-flex; justify-content: center;">
        <span>Back to Portfolio</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
